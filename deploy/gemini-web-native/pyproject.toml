[project]
name = "gemini-web-native"
version = "0.1.0"
description = "Authenticated Gemini-native HTTP video bridge over the Gemini web app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.11",
    "fastapi>=0.121",
    "pydantic>=2.12",
    "uvicorn[standard]>=0.40",
    "playwright>=1.60,<2",
]

[project.optional-dependencies]
server = ["uvicorn[standard]>=0.40"]

[dependency-groups]
dev = [
    "basedpyright>=1.32",
    "httpx2[brotli,http2,zstd]>=2.12.0",
    "pytest>=8.4",
    "ruff>=0.15",
]

[tool.uv]
package = true

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
reportUnusedCallResult = "warning"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "error"
# FastAPI registers route handlers through decorators, so they are never called by name.
reportUnusedFunction = "none"
# JSON bodies in tests are intentionally untyped assertions against the wire contract.
reportAny = "none"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = [
    "error",
    # starlette's TestClient still imports the deprecated anyio alias
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_web_native"]
