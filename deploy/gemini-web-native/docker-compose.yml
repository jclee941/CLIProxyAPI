name: cliproxy-gemini-web-native

services:
  gemini-web-native:
    image: cliproxy-gemini-web-native:current
    container_name: cliproxy-gemini-web-native
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - cliproxy-backend
    volumes:
      - /run/gemini-web-native:/run/gemini-web-native:ro
      - /run/gemini-web-native/cookies:/tmp/gemini-cookies
    environment:
      GEMINI_NATIVE_CONFIG: /run/gemini-web-native/config.json
      GEMINI_COOKIE_PATH: /tmp/gemini-cookies
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

networks:
  cliproxy-backend:
    external: true
    name: cliproxyapi_backend
