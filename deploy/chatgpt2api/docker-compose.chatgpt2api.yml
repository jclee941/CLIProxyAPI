services:
  chatgpt2api:
    build:
      context: /opt/chatgpt2api
      dockerfile: Dockerfile
    image: chatgpt2api:e55aef2-cjk-free-effort
    container_name: chatgpt2api
    restart: unless-stopped
    command: ["/app/.venv/bin/uvicorn", "main:app", "--host", "0.0.0.0", "--port", "80", "--access-log"]
    networks:
      - backend
    ports:
      - "127.0.0.1:30002:80"
      - "192.168.50.114:30002:80"
    env_file:
      - /run/cliproxy/chatgpt2api.env
    environment:
      STORAGE_BACKEND: json
      UV_CACHE_DIR: /tmp/uv-cache
      HOME: /tmp
    volumes:
      - /opt/chatgpt2api/data:/app/data
      - /run/cliproxy/chatgpt2api-config.json:/app/config.json:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health?format=json')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  # Solves Cloudflare interstitials for chatgpt2api. Reached by service name on
  # the shared backend network, so it needs no published port.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    networks:
      - backend
    environment:
      LOG_LEVEL: info
      TZ: Asia/Seoul
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

networks:
  backend:
    external: true
    name: cliproxyapi_backend
