}
:root[data-theme='dark'] { --gw-button-text: var(--bg-secondary); }
@media (max-width: 768px) { :root { --gw-button-height: 44px; } }

* { box-sizing: border-box; }

.sidenav-brand { display: flex; align-items: center; gap: var(--gw-space-2); margin-bottom: var(--gw-space-4); padding: 0 var(--gw-space-2); font-weight: 700; }

.nav-item { display: flex; align-items: center; min-height: var(--gw-button-height); padding: 0 var(--gw-space-3); border-radius: var(--app-radius-md); color: var(--text-secondary); font-size: var(--gw-text-small); cursor: pointer; transition: background var(--gw-motion), color var(--gw-motion); }

.api-endpoint > summary { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gw-space-2); padding: var(--gw-space-3) var(--gw-space-4); cursor: pointer; list-style: none; }

.api-sample { margin: 0; padding: var(--gw-space-3); border-radius: var(--app-radius-sm); background: var(--app-input-bg); color: var(--text-primary); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--gw-text-small); line-height: 1.55; overflow-x: auto; white-space: pre; user-select: all; }

.feedback:empty { display: none; }

.btn { display: inline-flex; justify-content: center; align-items: center; gap: var(--gw-space-2); min-height: var(--gw-button-height); padding: var(--gw-space-2) var(--gw-button-padding); border: var(--gw-border) solid var(--border-color); border-radius: var(--app-radius-md); font-size: var(--gw-text-body); font-weight: 600; line-height: var(--gw-heading-line-height); cursor: pointer; transition: transform var(--gw-motion), opacity var(--gw-motion); }

.account-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(var(--gw-card-min), 100%), 1fr)); gap: var(--app-gap, var(--gw-space-5)); align-items: stretch; }
