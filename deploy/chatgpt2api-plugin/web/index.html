:root {
  --gw-font: var(--cpamp-plugin-font-family, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
  --gw-text-title: 24px;
  --gw-text-heading: 18px;
  --gw-text-body: 14px;
  --gw-text-small: 13px;
  --gw-text-caption: 12px;
  --gw-line-height: 1.5;
  --gw-heading-line-height: 1.3;
  --gw-space-1: 4px;
  --gw-space-2: 8px;
  --gw-space-3: 12px;
  --gw-space-4: 16px;
  --gw-space-5: 20px;
  --gw-space-6: 24px;
  --gw-space-8: 32px;
  --gw-space-12: 48px;
  --gw-button-height: 40px;
  --gw-button-padding: 14px;
  --gw-icon-size: 16px;
  --gw-track-height: 8px;
  --gw-card-min: 360px;
  --gw-dialog-width: 520px;
  --gw-radius-pill: 999px;
  --gw-border: 1px;
  --gw-focus: 2px;
  --gw-motion: 150ms ease;
  --gw-spin: 1s linear infinite;
  --gw-button-text: var(--primary-contrast);
  --gw-success-text: color-mix(in srgb, var(--data-badge-success-text) 65%, var(--text-primary));
  --gw-warning-text: color-mix(in srgb, var(--data-badge-warning-text) 65%, var(--text-primary));
  --gw-backdrop: color-mix(in srgb, var(--text-primary) 35%, transparent);
}
:root[data-theme='dark'] { --gw-button-text: var(--bg-secondary); }
@media (max-width: 768px) { :root { --gw-button-height: 44px; } }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg-primary); color: var(--text-primary); font: var(--gw-text-body)/var(--gw-line-height) var(--gw-font); }
button, a, input { font: inherit; }
h1, h2, h3, p, dl, dd, ul { margin: 0; }
h1, h2 { line-height: var(--gw-heading-line-height); font-weight: 700; }
h1 { font-size: var(--gw-text-title); }
h2 { font-size: var(--gw-text-heading); }
svg { width: var(--gw-icon-size); height: var(--gw-icon-size); flex-shrink: 0; }
.page { display: grid; gap: var(--gw-space-5); padding: var(--gw-space-6); word-break: keep-all; overflow-wrap: anywhere; }
.page-heading { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: var(--gw-space-4); }
.heading-copy { display: grid; gap: var(--gw-space-2); }
.muted, .caption, dt { color: var(--text-secondary); }
.caption { font-size: var(--gw-text-small); }
.feedback { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gw-space-3); padding: var(--gw-space-4); background: var(--surface-subtle); border: var(--gw-border) solid var(--border-color); border-radius: var(--app-radius-md); }
.feedback p { flex: 1; min-width: min(100%, var(--gw-card-min)); }
.badge { display: inline-flex; align-items: center; max-width: 100%; padding: var(--gw-space-1) var(--gw-space-3); font-size: var(--gw-text-small); font-weight: 600; border: var(--gw-border) solid var(--data-badge-neutral-border); border-radius: var(--gw-radius-pill); color: var(--data-badge-neutral-text); background: var(--data-badge-neutral-bg); }
.badge-success { color: var(--gw-success-text); background: var(--data-badge-success-bg); border-color: var(--data-badge-success-border); }
.badge-warning { color: var(--gw-warning-text); background: var(--data-badge-warning-bg); border-color: var(--data-badge-warning-border); }
.badge-danger { color: var(--data-badge-danger-text); background: var(--data-badge-danger-bg); border-color: var(--data-badge-danger-border); }
.content:empty { display: none; }
.resource-card { min-width: 0; display: grid; gap: var(--gw-space-5); padding: var(--app-card-padding, var(--gw-space-6)); background: var(--glass-bg); border: var(--gw-border) solid var(--glass-border); border-radius: var(--app-radius-lg); }
.section { display: grid; gap: var(--gw-space-4); min-width: 0; }
.separated { border-top: var(--gw-border) solid var(--border-color); padding-top: var(--gw-space-5); }
.details { display: grid; gap: var(--gw-space-3); }
.details:empty { display: none; }
.detail-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: var(--gw-space-4); }
dd { font-weight: 600; font-variant-numeric: tabular-nums; }
.model-count { font-size: var(--gw-text-small); color: var(--text-secondary); margin-left: var(--gw-space-2); font-weight: 400; }
.model-list { padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: var(--gw-space-2); }
.model-list:empty { display: none; }
.model-chip { max-width: 100%; padding: var(--gw-space-1) var(--gw-space-3); border: var(--gw-border) solid var(--border-color); border-radius: var(--app-radius-sm); background: var(--surface-subtle); font-size: var(--gw-text-small); }
.resource-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--gw-space-4); }
.btn { display: inline-flex; align-items: center; justify-content: center; max-width: 100%; min-height: var(--gw-button-height); padding: var(--gw-space-2) var(--gw-button-padding); gap: var(--gw-space-2); border: var(--gw-border) solid var(--border-color); border-radius: var(--app-radius-md); font-size: var(--gw-text-body); font-weight: 600; line-height: var(--gw-heading-line-height); text-decoration: none; cursor: pointer; transition: opacity var(--gw-motion); }
.btn-secondary { background: var(--app-surface-muted); color: var(--text-secondary); }
.btn-primary { background: var(--primary-solid); color: var(--gw-button-text); border-color: var(--primary-solid); }
.btn-secondary:hover:not([aria-disabled='true']) { color: var(--primary-color); background: var(--surface-subtle); border-color: var(--border-hover); }
.btn-primary:hover { background: var(--primary-solid-hover); }
.btn-primary:active { background: var(--primary-solid-active); }
.btn-secondary:active:not([aria-disabled='true']) { border-color: var(--primary-color); }
.btn[aria-disabled='true'] { opacity: .62; cursor: wait; }
.btn:focus-visible { outline: var(--gw-focus) solid var(--primary-color); outline-offset: var(--gw-focus); }
.account-area, .account-content { display: grid; gap: var(--gw-space-5); min-width: 0; }
.account-area h3 { font-size: var(--gw-text-heading); line-height: var(--gw-heading-line-height); }
.account-controls { display: flex; align-items: center; flex-wrap: wrap; gap: var(--gw-space-3); }
.account-feedback { display: grid; gap: var(--gw-space-2); padding: var(--gw-space-4); border-radius: var(--app-radius-md); background: var(--surface-subtle); }
.account-feedback .badge { justify-self: start; }
.source-list { display: grid; gap: var(--gw-space-4); list-style: none; padding: 0; }
.source-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--gw-space-3); padding-block: var(--gw-space-3); border-bottom: var(--gw-border) solid var(--border-color); }
.source-row:last-child { border-bottom: 0; }
.account-notice { padding: var(--gw-space-3) var(--gw-space-4); border: var(--gw-border) solid var(--data-badge-warning-border); border-radius: var(--app-radius-md); color: var(--gw-warning-text); background: var(--data-badge-warning-bg); }
.btn:disabled { opacity: .62; cursor: not-allowed; }
.btn:disabled:hover { color: var(--text-secondary); background: var(--app-surface-muted); border-color: var(--border-color); }
.account-dialog { width: min(var(--gw-dialog-width), calc(100% - var(--gw-space-8))); max-height: calc(100dvh - var(--gw-space-8)); padding: var(--gw-space-6); background: var(--app-surface-strong); color: var(--text-primary); border: var(--gw-border) solid var(--glass-border); border-radius: var(--app-radius-lg); overflow-wrap: anywhere; word-break: keep-all; }
.account-dialog::backdrop { background: var(--gw-backdrop); }
.consent-row { display: flex; gap: var(--gw-space-3); align-items: flex-start; min-height: var(--gw-button-height); cursor: pointer; }
.consent-row input { width: var(--gw-icon-size); height: var(--gw-icon-size); flex-shrink: 0; accent-color: var(--primary-solid); }
.consent-row input:focus-visible { outline: var(--gw-focus) solid var(--primary-color); outline-offset: var(--gw-focus); }
.dialog-open { overflow: hidden; }
@media (max-width: 768px) {
  .page { padding: var(--gw-space-4); }
  .resource-card { padding: var(--gw-space-5); }
  .detail-row { grid-template-columns: minmax(0, 1fr); gap: var(--gw-space-1); }
  .page-heading .btn, .resource-footer .btn { width: 100%; }
  .source-row .btn, .web-account .account-controls .btn, .account-dialog .btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
