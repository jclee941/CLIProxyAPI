input {
  file {
    id => "cliproxy-json-logs"
    path => "/var/log/cliproxy/*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/cliproxy.sincedb"
    codec => json {
      ecs_compatibility => "v8"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "cliproxy-%{+YYYY.MM.dd}"
    data_stream => false
    ilm_enabled => false
  }
}
